spring.application.name=PCA Exam Analyzer

# ============================================================
#  Supabase (PostgreSQL) for every profile, including local 'dev'.
#  Values come from .env (loaded by config/DotenvLoader) or real env vars on Render.
#  Use the Transaction Pooler URL (aws-1-<region>.pooler.supabase.com:6543, user postgres.<ref>,
#  with ?sslmode=require&prepareThreshold=0): the direct db.<ref>.supabase.co host is IPv6-only.
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep each app's pool small: local and Render share the same Supabase pooler.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
# A new pooler connection costs ~2 s; keepalive stops idle ones being dropped by the pooler.
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1500000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.port=${PORT:8080}

# --- Session / stay-logged-in ---
# Long server session, plus an always-on remember-me cookie (see SecurityConfig) so a
# logged-in user stays signed in until they explicitly log out. Set REMEMBER_ME_KEY in
# production (any long random string) so the cookie survives restarts and redeploys.
server.servlet.session.timeout=60d
pca.remember-me.key=${REMEMBER_ME_KEY:pca-local-dev-remember-me-key}

# --- Teacher seed account (from .env) ---
pca.teacher.username=${TEACHER_USERNAME:teacher}
pca.teacher.password=${TEACHER_PASSWORD:teacher123@}
pca.teacher.name=${TEACHER_NAME:PCA Teacher}

# --- Topic classification thresholds (percentages, easy to tune) ---
pca.analysis.weak-below=50
pca.analysis.strong-at-least=75

# Auth is username + password only (no email). Forgot-password is verified by NIC.

# --- Thymeleaf / web ---
spring.thymeleaf.cache=true
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.chain.cache=true
# --- Cloudflare R2 (S3-compatible) for MCQ question images; empty = keep images in the DB ---
pca.storage.r2.account-id=${R2_ACCOUNT_ID:}
pca.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
pca.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
pca.storage.r2.bucket=${R2_BUCKET:}

# Multipart is only used by the admin exam form (per-question MCQ images, 5 MB each).
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=120MB

# Compress student HTML, JSON, CSS and JavaScript over slower mobile connections.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json

# --- Logging ---
logging.level.org.hibernate.SQL=INFO
