# ============================================================
#  LOCAL DEV PROFILE: run against the bundled H2 database so the app works
#  without needing Supabase or a local Postgres instance.
#  Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

spring.datasource.url=jdbc:h2:file:./data/pca-dev;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local dev reads templates and static files straight from ../frontend (no rebuild/restart
# needed to see HTML/CSS/JS edits). Production still serves the copies packaged in the jar.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:../frontend/templates/
spring.web.resources.static-locations=file:../frontend/static/,classpath:/static/

# Student assets are versioned in their URLs, so caching them also makes localhost fast.
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.no-store=false

# Production-level: no sample papers/questions/references or demo student.
# Only the real teacher account is seeded. Flip to true to get explorable demo data.
pca.seed-sample-data=false
