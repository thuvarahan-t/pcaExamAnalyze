# ============================================================
#  LOCAL DEV PROFILE: connects to the SAME Supabase Postgres as production
#  (DB_URL / DB_USERNAME / DB_PASSWORD from .env, set in application.properties).
#  Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#  ⚠ Anything created while running locally (exams, uploads, submissions) is real data.
#  The old local H2 file database (backend/data/pca-dev.mv.db) is no longer used.
# ============================================================

spring.thymeleaf.cache=true

# Student assets are versioned in their URLs, so caching them also makes localhost fast.
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.no-store=false

# Production-level: no sample papers/questions/references or demo student.
# Only the real teacher account is seeded. Flip to true to get explorable demo data.
pca.seed-sample-data=false
