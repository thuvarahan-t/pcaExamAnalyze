# ============================================================
#  LOCAL DEV PROFILE — in-memory H2 (no Supabase needed).
#  Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#  H2 console at:  http://localhost:8080/h2-console  (JDBC URL below)
# ============================================================
# File-based H2 so locally-registered students/data PERSIST across restarts
# (was in-memory + create-drop, which wiped everything on every restart).
# The DB lives at backend/data/pca-dev.mv.db. AUTO_SERVER lets tools connect while the app runs.
spring.datasource.url=jdbc:h2:file:./data/pca-dev;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# update (not create-drop) keeps existing rows; schema is evolved in place, like production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.thymeleaf.cache=false

# Never cache static JS/CSS in dev, so edits show on a normal refresh
# (overrides the 30-day cache set in application.properties).
spring.web.resources.cache.cachecontrol.no-store=true

# Production-level: no sample papers/questions/references or demo student.
# Only the real teacher account is seeded. Flip to true to get explorable demo data.
pca.seed-sample-data=false
