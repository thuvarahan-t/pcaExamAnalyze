<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/common :: head('Reset password · PCA')}"></head>
<body>
<span class="lang-float" data-lang-slot></span>
<div class="auth-wrap">
    <div class="glass card-glass auth-card">
        <div class="auth-logo">
            <img th:src="@{/img/logo.png}" alt="Physics Cube Academy logo">
            <h1>Reset password</h1>
            <p>Enter your username and NIC to set a new password.</p>
        </div>

        <div th:if="${flashError}" class="alert error">
            <i class="bi bi-exclamation-circle"></i><span th:text="${flashError}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input class="input" type="text" id="username" name="username"
                       th:value="${username}" placeholder="Your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="nic">NIC number</label>
                <input class="input" type="text" id="nic" name="nic"
                       th:value="${nic}" placeholder="The NIC you registered with" required>
            </div>
            <div class="form-group">
                <label for="password">New password</label>
                <div class="password-wrap">
                    <input class="input" type="password" id="password" name="password"
                           placeholder="At least 6 characters" autocomplete="new-password" required>
                    <button class="icon-btn password-toggle" type="button" data-target="password"
                            aria-label="Show password"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <div class="password-wrap">
                    <input class="input" type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Re-enter new password" autocomplete="new-password" required>
                    <button class="icon-btn password-toggle" type="button" data-target="confirmPassword"
                            aria-label="Show confirm password"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">
                <i class="bi bi-shield-lock"></i> Reset password
            </button>
        </form>

        <div class="auth-switch">
            Remembered it? <a th:href="@{/login}">Back to sign in</a>
        </div>
    </div>
</div>
<script>
    (function () {
        document.querySelectorAll(".password-toggle").forEach(function (button) {
            button.addEventListener("click", function () {
                var target = document.getElementById(button.getAttribute("data-target"));
                var icon = button.querySelector("i");
                var show = target.type === "password";
                target.type = show ? "text" : "password";
                icon.className = show ? "bi bi-eye-slash" : "bi bi-eye";
                button.setAttribute("aria-label", show ? "Hide password" : "Show password");
                target.focus();
            });
        });
    })();
</script>
</body>
</html>
