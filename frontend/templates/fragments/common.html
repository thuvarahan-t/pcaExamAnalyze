<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a13ac">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${title}">PCA Exam Analyzer</title>
    <style th:if="${#strings.contains(title, 'Login') || #strings.contains(title, 'Register')}">
        html,
        body {
            background: #060814;
            color: #eef3ff;
        }
    </style>
    <link rel="icon" type="image/png" th:href="@{/img/favicon-circle.png(v=2)}">
    <link rel="apple-touch-icon" th:href="@{/img/favicon-circle.png(v=2)}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        (function () {
            function applyViewport() {
                var width = Math.round((window.visualViewport && window.visualViewport.width)
                    || document.documentElement.clientWidth
                    || window.innerWidth
                    || 0);
                var root = document.documentElement;
                root.style.setProperty("--browser-width", width + "px");
                root.style.setProperty("--app-vw", (width / 100) + "px");
                root.dataset.viewport = width <= 360 ? "xs" : (width <= 430 ? "sm" : (width <= 760 ? "md" : "lg"));
            }
            applyViewport();
            window.addEventListener("resize", applyViewport, { passive: true });
            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", applyViewport, { passive: true });
            }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css(v=18)}">
    <!-- Perceived-speed boosters: speculatively prefetch internal pages on hover so a click
         lands almost instantly, and give the tapped control immediate visual feedback. -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Links we must never pre-load: PDF generation (must save first), downloads,
            // new-tab links and anything opted out with data-no-prefetch.
            var SKIP = "[data-report],[data-no-prefetch],[download],[target=_blank]";

            if (window.HTMLScriptElement && HTMLScriptElement.supports
                    && HTMLScriptElement.supports("speculationrules")) {
                var rules = { prefetch: [{
                    source: "document",
                    where: { and: [{ href_matches: "/*" }, { not: { selector_matches: SKIP } }] },
                    eagerness: "moderate"
                }] };
                var tag = document.createElement("script");
                tag.type = "speculationrules";
                tag.textContent = JSON.stringify(rules);
                document.body.appendChild(tag);
            } else {
                // Fallback: warm the cache with <link rel=prefetch> on hover / touch-start.
                var seen = {};
                var prefetch = function (a) {
                    if (a.target === "_blank" || a.hasAttribute("download")
                            || a.matches(SKIP)) return;
                    var url;
                    try { url = new URL(a.href, location.href); } catch (e) { return; }
                    if (url.origin !== location.origin || seen[url.href]) return;
                    if (url.pathname.indexOf("/report/pdf") !== -1) return;
                    seen[url.href] = 1;
                    var link = document.createElement("link");
                    link.rel = "prefetch";
                    link.href = url.href;
                    document.head.appendChild(link);
                };
                var onHover = function (e) {
                    var a = e.target.closest && e.target.closest("a[href]");
                    if (a) prefetch(a);
                };
                document.addEventListener("pointerover", onHover, { passive: true });
                document.addEventListener("touchstart", onHover, { passive: true });
            }

            // Instant feedback: the tapped nav control dims immediately, even before the
            // (prefetched) next page paints.
            document.addEventListener("click", function (e) {
                var nav = e.target.closest && e.target.closest(
                    "a.atab:not(.atab-add), a.yearchip, a.qmap-ylabel, .nav-links a");
                if (nav) nav.classList.add("nav-pending");
            }, true);
        });
    </script>
</head>
<body>

<!-- ===================== Role-aware navbar ===================== -->
<nav th:fragment="navbar" class="glass-nav">
    <div class="nav-inner">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/img/logo.png}" alt="PCA logo">
            <span class="brand-text">
                Physics Cube Academy
                <small>Exam Analyzer</small>
            </span>
        </a>
        <button type="button" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
            <span class="nav-toggle-line"></span>
            <span class="nav-toggle-line"></span>
            <span class="nav-toggle-line"></span>
        </button>
        <div class="nav-links" id="navLinks">
            <th:block th:if="${isAuthenticated}">
                <a th:if="${isTeacher}" th:href="@{/teacher/dashboard}"><span class="nav-link-mark">Q</span> Question Map</a>
                <a th:if="${isStudent}" th:href="@{/student/dashboard}"><span class="nav-link-mark">M</span> My Attempts</a>
                <span class="nav-user">
                    <span class="avatar" th:text="${currentUserName != null ? #strings.substring(currentUserName,0,1) : 'U'}">U</span>
                    <span th:text="${currentUserName}">User</span>
                </span>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-ghost btn-sm nav-action"><span class="nav-link-mark">OUT</span> Logout</button>
                </form>
            </th:block>
            <th:block th:unless="${isAuthenticated}">
                <a th:href="@{/login}"><span class="nav-link-mark">IN</span> Login</a>
                <a th:href="@{/register}" class="btn btn-primary btn-sm"><span class="nav-link-mark light">+</span> Register</a>
            </th:block>
        </div>
    </div>
    <script>
        (function () {
            var btn = document.querySelector(".nav-toggle");
            var links = document.getElementById("navLinks");
            if (!btn || !links) return;

            function setOpen(open) {
                links.classList.toggle("open", open);
                btn.classList.toggle("open", open);
                btn.setAttribute("aria-expanded", open ? "true" : "false");
                document.body.classList.toggle("nav-menu-open", open);
            }

            btn.addEventListener("click", function () {
                setOpen(!links.classList.contains("open"));
            });
            // Close the menu after tapping a link (mobile).
            links.addEventListener("click", function (e) {
                if (e.target.closest("a, button")) setOpen(false);
            });
            document.addEventListener("click", function (e) {
                if (!links.classList.contains("open")) return;
                if (!e.target.closest(".glass-nav")) setOpen(false);
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") setOpen(false);
            });
        })();
    </script>
</nav>

<!-- ===================== Flash messages ===================== -->
<div th:fragment="flash">
    <div th:if="${flashSuccess}" class="alert success">
        <i class="bi bi-check-circle"></i><span th:text="${flashSuccess}"></span>
    </div>
    <div th:if="${flashInfo}" class="alert info">
        <i class="bi bi-info-circle"></i><span th:text="${flashInfo}"></span>
    </div>
    <div th:if="${flashError}" class="alert error">
        <i class="bi bi-exclamation-triangle"></i><span th:text="${flashError}"></span>
    </div>
</div>

<!-- ===================== Footer ===================== -->
<footer th:fragment="footer" class="app-footer">
    <div>© <span th:text="${#dates.format(#dates.createNow(),'yyyy')}">2026</span> Physics Cube Academy (PCA) · Exam Analyzer</div>
</footer>

<!-- ===================== Scripts (Chart.js) ===================== -->
<th:block th:fragment="charts-cdn">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/charts.js}"></script>
</th:block>

</body>
</html>
