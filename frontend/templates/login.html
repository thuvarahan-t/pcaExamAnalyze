<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/common :: head('Login · PCA Exam Analyzer')}"></head>
<body>
<div class="auth-wrap">
    <div class="glass card-glass auth-card">
        <div class="auth-logo">
            <img th:src="@{/img/logo.png}" alt="Physics Cube Academy logo">
            <h1>Welcome back</h1>
            <p>Physics Cube Academy · Exam Analyzer</p>
        </div>

        <div th:if="${param.error}" class="alert error">
            <i class="bi bi-exclamation-circle"></i><span>Invalid username or password. Please try again.</span>
        </div>
        <div th:if="${param.logout}" class="alert info">
            <i class="bi bi-info-circle"></i><span>You have been logged out.</span>
        </div>
        <div th:if="${param.registered}" class="alert success">
            <i class="bi bi-check-circle"></i><span>Account created — please sign in.</span>
        </div>
        <div th:if="${param.reset}" class="alert success">
            <i class="bi bi-check-circle"></i><span>Password updated — sign in with your new password.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input class="input" type="text" id="username" name="username"
                       placeholder="Your username" required autofocus>
            </div>
            <div class="form-group">
                <div class="flex items-center justify-between">
                    <label for="password" style="margin:0;">Password</label>
                    <a th:href="@{/forgot-password}" style="font-size:.8rem;color:var(--brand);text-decoration:none;font-weight:600;">Forgot?</a>
                </div>
                <input class="input mt-1" type="password" id="password" name="password"
                       placeholder="••••••••" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">
                <i class="bi bi-box-arrow-in-right"></i> Sign in
            </button>
        </form>

        <div class="auth-switch">
            New student? <a href="/register" th:href="@{/register}">Create an account</a>
        </div>
    </div>
</div>
</body>
</html>
