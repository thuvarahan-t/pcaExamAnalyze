<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="label(value)"><span th:if="${#lists.isEmpty(value.lines)}" th:text="${value.text}"></span><th:block th:each="line : ${value.lines}"><img class="shaped" th:src="${line.uri}" th:style="|height:${line.heightPt}pt|"/><br/></th:block></th:block>
<table th:fragment="topics(rows)" class="analysis-table"><thead><tr><th style="width:36%">Subject / syllabus area</th><th style="width:12%">Questions</th><th style="width:9%">Correct</th><th style="width:9%">Wrong</th><th style="width:9%">Blank</th><th style="width:25%">Accuracy</th></tr></thead><tbody><tr th:each="t : ${rows}"><td><th:block th:replace="~{report/performance-fragments :: label(${t.name})}"/><small th:if="${t.limited}" class="sample">Limited evidence: fewer than 3 questions</small></td><td th:text="${t.total}"></td><td th:text="${t.correct}"></td><td th:text="${t.wrong}"></td><td th:text="${t.blank}"></td><td><b th:text="${t.accuracy}"></b> <span class="band" th:classappend="${t.band == 'Weak' ? 'weak' : (t.band == 'Strong' ? 'strong' : 'mid')}" th:text="${t.band}"></span><div class="bar-track"><div class="bar" th:classappend="${t.band == 'Weak' ? 'weak' : (t.band == 'Strong' ? 'strong' : 'mid')}" th:style="|width:${t.bar}%|"></div></div></td></tr></tbody></table>
</body></html>
