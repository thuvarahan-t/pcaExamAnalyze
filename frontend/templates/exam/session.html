<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="|${workspace.examName} · Answer Sheet|">MCQ Paper</title><link rel="icon" type="image/png" th:href="@{/img/favicon-circle.png}"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" media="print" onload="this.media='all'"><link rel="stylesheet" th:href="@{/css/exam-student.css(v=7)}"><link rel="stylesheet" th:href="@{/css/exam-dialog.css(v=2)}"></head><body class="workspace-body" th:attr="data-submission=${workspace.submissionId},data-total=${workspace.totalQuestions},data-options=${workspace.optionsPerQuestion},data-remaining=${workspace.remainingSeconds}">
<header class="workspace-nav"><div class="student-shell workspace-bar"><div class="workspace-title"><strong th:text="${workspace.examName}"></strong><a th:href="@{/exam/p/{slug}(slug=${workspace.slug})}"><i class="bi bi-arrow-left"></i> Paper details</a></div><div class="progress-block"><div class="progress-copy"><span id="progressCopy" th:text="|${workspace.answers.size()} of ${workspace.totalQuestions} answered|"></span><span id="progressPercent" th:text="|${workspace.answers.size() * 100 / workspace.totalQuestions}%|"></span></div><div class="progress-track"><div class="progress-fill" id="progressFill" th:style="|width:${workspace.answers.size() * 100 / workspace.totalQuestions}%|"></div></div></div><div class="workspace-tools"><button class="paper-trigger" id="paperPreviewOpen" type="button"><i class="bi bi-file-earmark-pdf-fill"></i><span>Question Paper</span></button><div class="timer" id="examTimer"><i class="bi bi-clock-fill"></i><span id="timerText" th:text="${workspace.remainingSeconds < 0 ? 'No limit' : '--:--'}"></span></div></div></div></header>
<div class="alert student-shell" style="margin-top:10px" th:if="${examError}" th:text="${examError}"></div>
<main class="workspace-main"><section class="sheet-panel"><div class="panel-head"><h2>MCQ Answer Sheet</h2><span style="color:#64748b;font-size:10px;font-weight:800">Choose one answer per question</span></div><div class="answer-sheet" id="answerSheet"><section class="answer-column" th:each="group : ${#numbers.sequence(0,4)}"><div class="answer-row" th:each="q : ${#numbers.sequence(group * 10 + 1, group * 10 + 10)}" th:classappend="${q > workspace.totalQuestions} ? ' disabled'" th:attr="data-question=${q}"><span class="q-number" th:text="${q}"></span><span class="answer-choice" th:each="option : ${#numbers.sequence(1,5)}"><input type="radio" th:id="|q${q}o${option}|" th:name="|q${q}|" th:value="${option}" th:disabled="${q > workspace.totalQuestions}" th:checked="${workspace.answers.get(q) == option}"><label th:for="|q${q}o${option}|" th:text="${option}"></label></span></div></section></div><div class="save-state" id="saveState"><i class="bi bi-cloud-check"></i> Saved</div></section></main>
<dialog class="paper-dialog" id="paperPreviewDialog"><div class="paper-dialog-head"><div><i class="bi bi-file-earmark-pdf-fill"></i><strong>Question Paper</strong></div><div><a th:href="${workspace.paperUrl}" target="_blank" rel="noopener">Open separately <i class="bi bi-box-arrow-up-right"></i></a><button id="paperPreviewClose" type="button" aria-label="Close paper preview"><i class="bi bi-x-lg"></i></button></div></div><iframe th:attr="data-src=${workspace.previewUrl}" loading="lazy" title="Question paper PDF preview"></iframe></dialog>
<form class="submit-dock" id="submitForm" th:action="@{/exam/session/{id}/submit(id=${workspace.submissionId})}" method="post"><div class="submit-summary"><strong id="dockAnswered" th:text="${workspace.answers.size()}"></strong> answered · <span><strong id="dockUnanswered" th:text="${workspace.totalQuestions - workspace.answers.size()}"></strong> unanswered</span></div><button class="submit-button" type="submit">Submit Paper <i class="bi bi-send-check-fill"></i></button></form>
<script th:src="@{/js/exam-dialog.js(v=2)}"></script><script th:src="@{/js/exam-session.js(v=10)}"></script></body></html>
