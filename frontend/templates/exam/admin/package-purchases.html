<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head th:replace="~{exam/admin/package-layout :: head('Confirmed Purchases')}"></head><body class="offer-admin-page"><div class="admin-shell">
<aside th:replace="~{exam/admin/sidebar :: sidebar('offers')}"></aside><main class="admin-main">
<div class="admin-page-head"><div><a class="eyebrow teal" th:href="@{/exam/admin/packages}">← ALL PACKAGES</a><h1 th:text="${pack.name}"></h1></div><a class="btn" th:href="@{/exam/admin/packages/{id}/edit(id=${pack.id})}">Edit package</a></div>
<th:block th:replace="~{exam/admin/package-layout :: flash}"></th:block>
<div class="glass-card capacity-summary"><strong th:text="|${#lists.size(purchases)} / ${pack.capacity}|"></strong><span>confirmed purchases</span></div>
<section class="glass-card admin-panel"><h2>Add confirmed purchase</h2>
<form th:action="@{/exam/admin/packages/{id}/purchases(id=${pack.id})}" method="post"><div class="admin-form-grid">
<div class="admin-field"><label for="purchaseRegistration">Registration ID</label><input class="form-input" id="purchaseRegistration" name="registrationId" th:value="${enteredRegistration}" required pattern="[A-Za-z0-9-]{3,30}" maxlength="30" placeholder="e.g. 261107"></div>
<div class="admin-field"><label for="purchaseName">Student name</label><input class="form-input" id="purchaseName" name="name" th:value="${enteredName}" maxlength="150" placeholder="Name (auto-filled if available)"></div></div>
<div class="admin-form-buttons"><button class="btn primary" type="submit" th:disabled="${#lists.size(purchases) >= pack.capacity}">Confirm purchase</button></div><p class="error" th:if="${#lists.size(purchases) >= pack.capacity}">This package is full. Increase capacity to record more purchases.</p></form></section>
<section class="glass-card admin-panel"><h2>Confirmed students</h2><div class="offer-student-search" th:if="${!#lists.isEmpty(purchases)}"><label for="purchaseFilter">Search confirmed students</label><input class="form-input" id="purchaseFilter" type="search" placeholder="Name or registration ID"><p class="offer-search-status" id="purchaseFilterStatus" role="status"></p></div><div class="table-wrap" th:if="${!#lists.isEmpty(purchases)}"><table class="admin-table"><thead><tr><th>REGISTRATION ID</th><th>STUDENT NAME</th><th>CONFIRMED · SRI LANKA</th><th></th></tr></thead><tbody><tr th:each="purchase : ${purchases}" data-purchase-row><td><strong th:text="${purchase.registrationId}"></strong></td><td th:text="${purchase.studentName}"></td><td th:text="${#temporals.format(purchase.confirmedAt.atZone(zone), 'dd MMM yyyy, hh:mm a')}"></td><td><form th:action="@{/exam/admin/packages/{id}/purchases/{purchaseId}/remove(id=${pack.id},purchaseId=${purchase.id})}" method="post" data-confirm-title="Remove confirmed purchase?" data-confirm-action="Remove" data-confirm-type="danger" th:attr="data-confirm=|Remove the confirmed purchase for ${purchase.registrationId}?|"><button class="btn danger" type="submit" th:attr="data-student=${purchase.registrationId}">Remove</button></form></td></tr></tbody></table></div>
<div class="pkg-empty" th:if="${#lists.isEmpty(purchases)}"><h3>No confirmed purchases yet.</h3><p>Add the first registration ID after confirming payment.</p></div></section>
</main></div></body></html>
