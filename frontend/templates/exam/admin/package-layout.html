<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1f3a">
<title th:text="${title} + ' · PCA Admin'"></title>
<link rel="icon" th:href="@{/img/favicon-circle.png}"><link rel="stylesheet" th:href="@{/css/tamil-fonts.css(v=1)}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/class-packages.css(v=16)}"><link rel="stylesheet" th:href="@{/css/exam-admin.css(v=23)}"><link rel="stylesheet" th:href="@{/css/offer-admin.css(v=3)}">
<link rel="stylesheet" th:href="@{/css/exam-dialog.css(v=1)}">
<script defer th:src="@{/js/exam-dialog.js(v=1)}"></script>
<script defer th:src="@{/js/package-admin.js(v=5)}"></script>
</head><body>
<aside th:fragment="nav" th:replace="~{exam/admin/sidebar :: sidebar('offers')}"></aside>

</body></html>
