<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head th:replace="~{exam/admin/package-layout :: head('Offer')}"></head><body class="offer-admin-page"><div class="admin-shell">
<aside th:replace="~{exam/admin/sidebar :: sidebar('offers')}"></aside><main class="admin-main">
<div class="admin-page-head"><div><h1>Offer</h1></div><a class="btn primary" th:href="@{/exam/admin/packages/new}">+ Create package</a></div>
<th:block th:replace="~{exam/admin/package-layout :: flash}"></th:block>
<section class="glass-card admin-panel"><h2>Campaign settings</h2>
<form th:action="@{/exam/admin/packages/campaign}" method="post" th:object="${campaignForm}"><div class="admin-form-grid campaign-fields">
<div class="admin-field"><label for="title">Page headline</label><input class="form-input" id="title" th:field="*{title}" required maxlength="160"><span class="error" th:errors="*{title}"></span></div>
<div class="admin-field"><label for="endsAt">Offer ends · Sri Lanka time</label><input class="form-input" id="endsAt" type="datetime-local" th:field="*{endsAt}" required><span class="error" th:errors="*{endsAt}"></span></div>
<div class="admin-field"><label for="whatsappNumber">Admin WhatsApp number</label><input class="form-input" id="whatsappNumber" placeholder="94779179035" th:field="*{whatsappNumber}" required pattern="[1-9][0-9]{7,14}" maxlength="15" inputmode="tel"><span class="error" th:errors="*{whatsappNumber}"></span></div>
<div class="campaign-save"><button class="btn primary" type="submit">Save settings</button></div></div></form></section>
<div class="admin-card-grid"><article class="glass-card admin-pack-card" th:each="pack : ${packages}">
<span class="publication-tag" th:classappend="${!pack.published} ? 'draft'" th:text="${pack.published ? 'PUBLISHED' : 'DRAFT / HIDDEN'}"></span>
<a th:href="@{/exam/admin/packages/{id}/edit(id=${pack.id})}"><img th:src="@{/exam/admin/packages/{id}/poster(id=${pack.id},v=${pack.posterVersion})}" th:alt="${pack.name}" loading="lazy"></a><h2 th:text="${pack.name}"></h2>
<p><strong th:text="|${pack.purchased} / ${pack.capacity} confirmed|"></strong><br><span th:text="|Rs. ${#numbers.formatDecimal(pack.offerPrice, 1, 'COMMA', 0, 'POINT')}|"></span></p>
<div class="admin-actions"><a class="btn primary" th:href="@{/exam/admin/packages/{id}/purchases(id=${pack.id})}">Purchases</a><a class="btn" th:href="@{/exam/admin/packages/{id}/edit(id=${pack.id})}">Edit</a>
<form th:action="@{/exam/admin/packages/{id}/toggle(id=${pack.id})}" method="post"><button class="btn" type="submit" th:text="${pack.published ? 'Hide' : 'Publish'}"></button></form></div>
</article></div><div class="pkg-empty" th:if="${#lists.isEmpty(packages)}"><h2>Your first package starts here.</h2><p>Create a package and upload a poster to get started.</p></div>
</main></div></body></html>
