services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      SPRING_THYMELEAF_PREFIX: classpath:/templates/
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: classpath:/static/
    volumes:
      - pca_data:/app/data

volumes:
  pca_data:
