<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quarterly Structure · 2021–2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* tweakable */
    --blur: 14px;
    --card-op: 0.58;
    --accent: #2f6df0;
    --accent-2: #4aa8ff;

    --radius: 18px;

    /* light theme (default) */
    --page-bg:
      radial-gradient(120% 90% at 82% -12%, #d8e7ff 0%, transparent 55%),
      radial-gradient(110% 85% at -12% 112%, #e3f0ff 0%, transparent 55%),
      linear-gradient(160deg, #f6faff, #e9f2fc);
    --ink: #15294a;
    --ink-dim: #5d76a0;
    --glass-bg: rgba(255, 255, 255, var(--card-op));
    --glass-bd: color-mix(in srgb, var(--accent) 28%, rgba(255,255,255,.6));
    --card-shadow: 0 18px 40px -20px rgba(40, 90, 180, .45);
    --card-inset: inset 0 1px 0 rgba(255, 255, 255, .9);
    --ylabel-bg: linear-gradient(150deg,
      color-mix(in srgb, var(--accent) 18%, transparent),
      color-mix(in srgb, var(--accent-2) 8%, transparent));
    --track: rgba(30, 60, 110, .12);
    --up: hsl(150 62% 34%);
    --down: hsl(5 76% 50%);
    --orb-1: hsl(218 100% 74% / .55);
    --orb-2: hsl(205 100% 80% / .5);
    --orb-3: hsl(190 100% 76% / .42);
  }

  [data-theme="dark"] {
    --page-bg:
      radial-gradient(120% 90% at 80% -10%, #0d2548 0%, transparent 55%),
      radial-gradient(110% 80% at -10% 110%, #0a1c3d 0%, transparent 55%),
      linear-gradient(160deg, #081124, #050a18);
    --ink: #e8f1fb;
    --ink-dim: #8fa7c4;
    --glass-bg: rgba(255, 255, 255, calc(var(--card-op) / 7));
    --glass-bd: color-mix(in srgb, var(--accent) 30%, rgba(150,220,255,.18));
    --card-shadow: 0 12px 30px -12px rgba(0, 0, 0, .7);
    --card-inset: inset 0 1px 0 rgba(255, 255, 255, .10);
    --track: rgba(255, 255, 255, .08);
    --up: hsl(160 75% 58%);
    --down: hsl(8 85% 66%);
    --orb-1: hsl(195 95% 55% / .55);
    --orb-2: hsl(225 90% 58% / .45);
    --orb-3: hsl(170 90% 55% / .30);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Space Grotesk", system-ui, sans-serif;
    color: var(--ink);
    background: var(--page-bg);
    background-attachment: fixed;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 5vw, 64px);
    overflow-x: hidden;
    position: relative;
    transition: color .4s ease;
  }

  /* ---------- ambient depth orbs ---------- */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .9;
    pointer-events: none;
    z-index: 0;
    animation: float 18s ease-in-out infinite;
  }
  .orb.a { width: 460px; height: 460px; top: -120px; right: -80px;
    background: radial-gradient(circle, var(--orb-1), transparent 70%); }
  .orb.b { width: 520px; height: 520px; bottom: -180px; left: -120px;
    background: radial-gradient(circle, var(--orb-2), transparent 70%);
    animation-delay: -6s; }
  .orb.c { width: 300px; height: 300px; top: 40%; left: 55%;
    background: radial-gradient(circle, var(--orb-3), transparent 70%);
    animation-delay: -11s; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(28px,-34px) scale(1.08); }
  }
  body.no-orbs .orb { display: none; }

  /* ---------- shell ---------- */
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 1040px; }

  .head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 18px; flex-wrap: wrap;
    margin-bottom: clamp(20px, 3vw, 30px);
  }
  .head h1 {
    font-size: clamp(26px, 4.4vw, 44px);
    font-weight: 700; letter-spacing: -0.02em; line-height: 1.04;
  }
  .head h1 .accent {
    background: linear-gradient(95deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .head p {
    color: var(--ink-dim); font-size: clamp(13px, 1.6vw, 15px);
    margin-top: 8px; max-width: 42ch;
  }
  .legend {
    display: flex; align-items: center; gap: 9px;
    font-size: 12.5px; color: var(--ink-dim);
    padding: 9px 14px; border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-bd);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    white-space: nowrap;
  }
  .legend .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px 2px color-mix(in srgb, var(--accent) 75%, transparent);
  }

  /* ---------- table ---------- */
  .table { display: flex; flex-direction: column; gap: 14px; }

  .row {
    display: grid;
    grid-template-columns: 116px repeat(4, 1fr);
    gap: 14px;
    perspective: 1000px;
  }

  .colhead {
    display: grid;
    grid-template-columns: 116px repeat(4, 1fr);
    gap: 14px;
    padding: 0 6px 2px;
  }
  .colhead span {
    font-size: 12px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-dim); text-align: center;
  }
  .colhead span:first-child { text-align: left; }

  .glass {
    position: relative;
    border-radius: var(--radius);
    background: var(--glass-bg);
    border: 1px solid var(--glass-bd);
    backdrop-filter: blur(var(--blur)) saturate(135%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(135%);
    box-shadow: var(--card-shadow), var(--card-inset);
    overflow: hidden;
  }

  .ylabel {
    display: flex; flex-direction: column; justify-content: center;
    padding: 18px 16px;
    background: var(--ylabel-bg), var(--glass-bg);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .ylabel b { font-size: clamp(22px, 3vw, 30px); font-weight: 700; letter-spacing: -.01em; }
  .ylabel small { font-size: 11px; color: var(--ink-dim); letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }

  .cell {
    padding: 20px 18px 18px;
    min-height: 104px;
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: default;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease;
    will-change: transform;
  }
  .cell .qtag {
    display: none;
    font-size: 11px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--accent);
  }
  .cell .val {
    font-size: clamp(24px, 3.2vw, 32px);
    font-weight: 700; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    transform: translateZ(34px);
  }
  .cell .meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 500;
    transform: translateZ(20px);
  }
  .cell .meta.up   { color: var(--up); }
  .cell .meta.down { color: var(--down); }
  .cell .meta .arrow { font-size: 11px; }
  body.hide-delta .cell .meta { visibility: hidden; }

  .cell .glare {
    position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: radial-gradient(180px 180px at var(--gx,50%) var(--gy,0%),
      color-mix(in srgb, var(--accent-2) 38%, transparent), transparent 60%);
    opacity: 0; transition: opacity .3s ease;
    mix-blend-mode: screen;
  }
  .cell:hover { box-shadow: 0 26px 50px -18px color-mix(in srgb, var(--accent) 45%, transparent), var(--card-inset); }
  .cell:hover .glare { opacity: 1; }

  .bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; transform: translateZ(8px); }
  .bar > i { display: block; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent);
    width: 0; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }

  /* ---------- entrance (transform-only so frozen frames still show) ---------- */
  @keyframes rise { from { transform: translateY(24px); } to { transform: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .head, .row, .colhead { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    .head { animation-duration: .8s; }
    .colhead { animation-delay: .05s; }
    .row:nth-child(2) { animation-delay: .14s; }
    .row:nth-child(3) { animation-delay: .22s; }
    .row:nth-child(4) { animation-delay: .30s; }
    .row:nth-child(5) { animation-delay: .38s; }
    .row:nth-child(6) { animation-delay: .46s; }
  }

  /* ---------- mobile ---------- */
  @media (max-width: 660px) {
    .colhead { display: none; }
    .row {
      grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px;
      border-radius: 22px;
      background: color-mix(in srgb, var(--accent) 5%, transparent);
      border: 1px solid var(--glass-bd);
    }
    .ylabel {
      grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 10px;
      padding: 6px 6px 4px;
      background: none; border: none; box-shadow: none; backdrop-filter: none;
    }
    .ylabel small { margin: 0; }
    .cell { min-height: 92px; padding: 14px; }
    .cell .qtag { display: block; margin-bottom: 8px; }
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <main class="wrap">
    <header class="head">
      <div>
        <h1>Quarterly <span class="accent">Structure</span></h1>
        <p>Revenue contribution by quarter, 2021&ndash;2025. Move your cursor across a cell to tilt it.</p>
      </div>
      <div class="legend"><span class="dot"></span> Values in &#36;M &middot; vs. prior quarter</div>
    </header>

    <section class="table" id="table">
      <div class="colhead">
        <span>Year</span><span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span>
      </div>
    </section>
  </main>

  <div id="tweak-root"></div>

<script>
  // sample data: revenue ($M) per quarter, 2021–2025
  const DATA = [
    { year: 2021, q: [1.8, 2.1, 2.4, 3.0] },
    { year: 2022, q: [3.2, 3.0, 3.6, 4.4] },
    { year: 2023, q: [4.6, 5.1, 5.0, 6.2] },
    { year: 2024, q: [6.5, 7.0, 7.8, 8.1] },
    { year: 2025, q: [8.4, 9.2, 9.0, 10.3] },
  ];
  const QLABELS = ["Q1", "Q2", "Q3", "Q4"];
  const MAX = 11;
  window.__tilt = 14;

  const table = document.getElementById("table");
  let prevTail = null;

  DATA.forEach((d) => {
    const row = document.createElement("div");
    row.className = "row";

    const yl = document.createElement("div");
    yl.className = "glass ylabel";
    yl.innerHTML = `<b>${d.year}</b><small>FY</small>`;
    row.appendChild(yl);

    d.q.forEach((v, i) => {
      const prev = i === 0 ? prevTail : d.q[i - 1];
      let pct = prev == null ? null : ((v - prev) / prev) * 100;
      const cell = document.createElement("div");
      cell.className = "glass cell";
      const dir = pct == null ? "" : pct >= 0 ? "up" : "down";
      const arrow = pct == null ? "" : pct >= 0 ? "▲" : "▼";
      const metaTxt = pct == null ? "&mdash;" : `${Math.abs(pct).toFixed(1)}%`;
      cell.innerHTML = `
        <span class="qtag">${QLABELS[i]}</span>
        <div class="val">$${v.toFixed(1)}M</div>
        <div class="meta ${dir}"><span class="arrow">${arrow}</span> ${metaTxt}</div>
        <div class="bar"><i data-w="${Math.min(100, (v / MAX) * 100)}"></i></div>
        <div class="glare"></div>`;
      row.appendChild(cell);
    });

    prevTail = d.q[d.q.length - 1];
    table.appendChild(row);
  });

  requestAnimationFrame(() => setTimeout(() => {
    document.querySelectorAll(".bar > i").forEach((b) => { b.style.width = b.dataset.w + "%"; });
  }, 500));

  document.querySelectorAll(".cell").forEach((cell) => {
    const glare = cell.querySelector(".glare");
    cell.addEventListener("pointermove", (e) => {
      const max = window.__tilt || 0;
      const r = cell.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const ry = (px - 0.5) * 2 * max;
      const rx = (0.5 - py) * 2 * max;
      cell.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(6px) scale(1.035)`;
      glare.style.setProperty("--gx", px * 100 + "%");
      glare.style.setProperty("--gy", py * 100 + "%");
    });
    cell.addEventListener("pointerleave", () => { cell.style.transform = ""; });
  });
</script>

<!-- ---------- Tweaks ---------- -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
  const { useEffect } = React;

  const ACCENTS = {
    "Ocean blue": ["#2f6df0", "#4aa8ff"],
    "Cyan":       ["#0bb3d6", "#46d8ef"],
    "Indigo":     ["#5b5bf0", "#9a8bff"],
    "Teal":       ["#0aa37f", "#46d6b0"],
  };

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "accent": [
      "#2f6df0",
      "#4aa8ff"
    ],
    "tilt": 14,
    "frost": 15,
    "cardOpacity": 58,
    "showDelta": true,
    "orbs": true
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

    useEffect(() => {
      const root = document.documentElement;
      root.setAttribute("data-theme", t.theme);
      const acc = Array.isArray(t.accent) ? t.accent : [t.accent, t.accent];
      root.style.setProperty("--accent", acc[0]);
      root.style.setProperty("--accent-2", acc[1] || acc[0]);
      root.style.setProperty("--blur", t.frost + "px");
      root.style.setProperty("--card-op", (t.cardOpacity / 100).toFixed(3));
      window.__tilt = t.tilt;
      document.body.classList.toggle("hide-delta", !t.showDelta);
      document.body.classList.toggle("no-orbs", !t.orbs);
    }, [t]);

    return (
      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={t.theme} options={["light", "dark"]}
                    onChange={(v) => setTweak("theme", v)} />
        <TweakColor label="Accent" value={t.accent} options={Object.values(ACCENTS)}
                    onChange={(v) => setTweak("accent", v)} />

        <TweakSection label="Glass" />
        <TweakSlider label="Frost / blur" value={t.frost} min={2} max={28} step={1} unit="px"
                     onChange={(v) => setTweak("frost", v)} />
        <TweakSlider label="Card opacity" value={t.cardOpacity} min={20} max={92} step={1} unit="%"
                     onChange={(v) => setTweak("cardOpacity", v)} />

        <TweakSection label="Motion & data" />
        <TweakSlider label="3D tilt" value={t.tilt} min={0} max={24} step={1} unit="°"
                     onChange={(v) => setTweak("tilt", v)} />
        <TweakToggle label="Show % change" value={t.showDelta}
                     onChange={(v) => setTweak("showDelta", v)} />
        <TweakToggle label="Floating orbs" value={t.orbs}
                     onChange={(v) => setTweak("orbs", v)} />
      </TweaksPanel>
    );
  }

  ReactDOM.createRoot(document.getElementById("tweak-root")).render(<App />);
</script>
</body>
</html>
